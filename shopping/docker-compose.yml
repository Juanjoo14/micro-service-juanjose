services:
  shopping:
    container_name: c-shopping
    build: .
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      DB_URL: mongodb://shopping-db:27017/shopping
      APP_SECRET: ${APP_SECRET:?define APP_SECRET in shopping/.env}
      PRODUCTS_URL: http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - shopping-db

  shopping-db:
    container_name: c-shopping-db
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - shopping-data:/data/db

volumes:
  shopping-data:
